[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uader-is2-tpfi"
version = "1.0.1"
description = "TPFI Proxy/Singleton/Observer en entorno AWS"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
    "botocore>=1.35,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
exclude = '''
/(
    \.venv
  | \.delivery
  | evidence
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    ".delivery",
    "evidence",
    ".git",
    ".pytest_cache",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D107"]

[tool.pytest.ini_options]
addopts = "-q --cov=tpfi --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tpfi"]
mypy_path = "src"
ignore_missing_imports = true
exclude = [
    "^evidence/",
    "^\\.venv/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "evidence",
    ".venv"
]
